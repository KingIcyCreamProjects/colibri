<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b0d" />
    <meta name="description" content="A local interface for the colibrì inference engine" />
    <title>colibrì</title>
    <script>
      // Apply the saved theme before first paint so there is no flash. "auto"
      // leaves the attribute off and lets prefers-color-scheme decide.
      try {
        var t = localStorage.getItem("colibri.theme")
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
